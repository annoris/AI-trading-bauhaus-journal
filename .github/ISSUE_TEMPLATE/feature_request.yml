name: Feature Request
description: Suggest a new broker importer, metric, chart, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What workflow or analysis gap are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature, importer format, or UX behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Sample anonymized CSV headers, screenshots, or formula references (never share live API keys or real account numbers).
