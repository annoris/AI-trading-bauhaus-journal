packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  better-sqlite3: true
ignoredOptionalDependencies:
  - sharp
minimumReleaseAgeExclude:
  - "@ai-sdk/openai@4.0.64"
  - "@ai-sdk/provider-utils@5.0.38"
  - "@ai-sdk/provider@4.0.12"
  - "@luxalgo/broker-sdk@0.5.1"

# Security fixes for transitive dependencies, pinned for reproducible builds.
overrides:
  zod: 4.6.7
  next>postcss: 8.5.26
  source-map-js: 1.2.2
  undici: 7.30.1
  vite: 7.3.7
  esbuild: 0.28.1
  tinypool: 2.1.2
